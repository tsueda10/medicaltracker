<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>服薬カレンダー</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    /* Tailwind CSSを読み込めない場合も、カレンダーの列と記録状態を表示する。 */
    #calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    #calendar button { min-width: 0; }
    .day-mark { color: #7b8798; }
    .day-mark[data-done="true"] { color: #1d4ed8; font-weight: 700; }
    .day[aria-pressed="true"] { background: #eff6ff; border-color: #2563eb; }
    .day[aria-current="date"] .day-number { text-decoration: underline; text-underline-offset: 3px; }
    .dose[data-done="true"] { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-900 antialiased">
  <main class="mx-auto max-w-3xl space-y-4 px-3 py-6 sm:space-y-5 sm:px-6 sm:py-10">
    <header class="rounded-3xl bg-slate-900 px-5 py-5 text-white sm:px-7">
      <div class="flex items-center gap-3">
        <span class="grid size-11 shrink-0 place-items-center rounded-2xl bg-blue-500/20 text-blue-200">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="3"/>
            <path d="M7 3v4m10-4v4M3 10h18m-12 5 2 2 4-4"/>
          </svg>
        </span>
        <div>
          <h1 class="text-xl font-bold tracking-tight sm:text-2xl">服薬カレンダー</h1>
          <p class="mt-0.5 text-sm text-slate-300">朝・昼・晩の服薬を日付ごとに記録</p>
        </div>
      </div>
    </header>

    <section aria-labelledby="month" class="rounded-3xl border border-slate-200 bg-white p-3 shadow-sm sm:p-5">
      <nav aria-label="カレンダーの表示月" class="mb-3 flex flex-wrap items-center justify-between gap-2">
        <h2 id="month" aria-live="polite" class="pl-1 text-lg font-bold tabular-nums sm:text-xl"></h2>
        <div class="flex items-center gap-1.5">
          <button id="previous" type="button"
            class="min-h-10 rounded-xl border border-slate-200 px-2.5 text-sm font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-blue-600">‹ 前月</button>
          <button id="next" type="button"
            class="min-h-10 rounded-xl border border-slate-200 px-2.5 text-sm font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-blue-600">翌月 ›</button>
          <button id="today" type="button"
            class="min-h-10 rounded-xl bg-blue-50 px-3 text-sm font-semibold text-blue-800 hover:bg-blue-100 focus-visible:outline-2 focus-visible:outline-blue-600">今日</button>
        </div>
      </nav>

      <div id="calendar" class="gap-1 sm:gap-2"></div>
      <p class="mb-0 mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-600">
        <span><strong class="text-blue-700">青太字</strong> 服薬済み</span>
        <span>灰色 未記録</span>
        <span>下線 今日</span>
      </p>
    </section>

    <section aria-labelledby="selected-date" class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
        <div>
          <p class="m-0 text-xs font-semibold text-slate-500">選択した日の記録</p>
          <h2 id="selected-date" aria-live="polite" class="mt-0.5 text-lg font-bold"></h2>
        </div>
        <span id="count" aria-live="polite" class="rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-blue-800"></span>
      </div>
      <div id="entries" class="space-y-2"></div>
      <p id="message" role="status" class="mb-0 mt-2 text-sm text-red-700 empty:hidden"></p>
    </section>
  </main>

  <script>
    const periods = [
      { key: 'morning', label: '朝' },
      { key: 'noon', label: '昼' },
      { key: 'evening', label: '晩' }
    ];
    const weekdays = ['月', '火', '水', '木', '金', '土', '日'];
    const prefix = 'medication-calendar-v1:';
    const byId = id => document.getElementById(id);
    const calendar = byId('calendar');
    const entries = byId('entries');
    const dateFormat = new Intl.DateTimeFormat('ja-JP', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
    const timeFormat = new Intl.DateTimeFormat('ja-JP', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
    });

    let selected = new Date();
    let month = monthStart(selected);

    function monthStart(date) {
      return new Date(date.getFullYear(), date.getMonth(), 1);
    }

    function dateKey(date) {
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function recordKey(date, period) {
      return `${prefix}${dateKey(date)}:${period}`;
    }

    function readTime(date, period) {
      try {
        const value = localStorage.getItem(recordKey(date, period));
        return value && Number.isFinite(Date.parse(value)) ? value : null;
      } catch {
        byId('message').textContent =
          'この画面ではブラウザの保存領域にアクセスできません。';
        return null;
      }
    }

    function writeTime(date, period, checked) {
      try {
        const key = recordKey(date, period);
        if (checked) {
          localStorage.setItem(key, new Date().toISOString());
        } else {
          localStorage.removeItem(key);
        }
        byId('message').textContent = '';
      } catch {
        byId('message').textContent =
          '変更を保存できませんでした。ブラウザの保存設定をご確認ください。';
      }
    }

    function renderCalendar(focusDate = false) {
      const year = month.getFullYear();
      const monthIndex = month.getMonth();
      const lastDay = new Date(year, monthIndex + 1, 0).getDate();
      const selectedKey = dateKey(selected);
      const todayKey = dateKey(new Date());
      const leadingDays = (month.getDay() + 6) % 7;

      byId('month').textContent = `${year}年${monthIndex + 1}月`;
      calendar.replaceChildren();

      for (const weekday of weekdays) {
        const heading = document.createElement('span');
        heading.className = 'pb-1 text-center text-xs font-semibold text-slate-600';
        heading.textContent = weekday;
        calendar.append(heading);
      }
      for (let i = 0; i < leadingDays; i++) {
        calendar.append(document.createElement('span'));
      }

      let activeButton;
      for (let day = 1; day <= lastDay; day++) {
        const date = new Date(year, monthIndex, day);
        const key = dateKey(date);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'day min-h-14 rounded-lg border border-slate-200 bg-white py-1 text-center hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-blue-700 sm:min-h-16 sm:rounded-xl';
        button.setAttribute('aria-pressed', String(key === selectedKey));
        if (key === todayKey) button.setAttribute('aria-current', 'date');
        if (key === selectedKey) activeButton = button;

        const number = document.createElement('span');
        number.className = 'day-number block text-sm font-bold tabular-nums sm:text-base';
        number.textContent = day;

        const marks = document.createElement('span');
        marks.className = 'mt-1 flex flex-wrap justify-center gap-x-px text-[10px] leading-tight sm:gap-x-1 sm:text-xs';
        const descriptions = [];

        for (const period of periods) {
          const recorded = Boolean(readTime(date, period.key));
          const mark = document.createElement('span');
          mark.className = 'day-mark';
          mark.dataset.done = String(recorded);
          mark.textContent = period.label;
          marks.append(mark);
          descriptions.push(`${period.label}は${recorded ? '服薬済み' : '未記録'}`);
        }

        button.setAttribute('aria-label', `${dateFormat.format(date)}、${descriptions.join('、')}`);
        button.append(number, marks);
        button.addEventListener('click', () => {
          selected = date;
          renderCalendar(true);
          renderEntries();
        });
        calendar.append(button);
      }

      if (focusDate) activeButton?.focus({ preventScroll: true });
    }

    function renderEntries(focusPeriod) {
      const date = selected;
      let completed = 0;
      byId('selected-date').textContent = dateFormat.format(date);
      entries.replaceChildren();

      for (const period of periods) {
        const recordedAt = readTime(date, period.key);
        const row = document.createElement('label');
        row.className = 'dose flex min-h-14 cursor-pointer items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2 hover:border-blue-400 sm:px-4';
        row.dataset.done = String(Boolean(recordedAt));

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'size-5 shrink-0 accent-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700';
        checkbox.checked = Boolean(recordedAt);
        checkbox.setAttribute('aria-label', `${period.label}の服薬`);

        const label = document.createElement('span');
        label.className = 'font-semibold';
        label.textContent = period.label;
        row.append(checkbox, label);

        if (recordedAt) {
          completed++;
          const time = document.createElement('time');
          const timestamp = new Date(recordedAt);
          const recordedDate = dateKey(timestamp) === dateKey(date)
            ? ''
            : `${dateFormat.format(timestamp)} `;
          time.dateTime = recordedAt;
          time.className = 'ml-auto text-right text-xs font-medium tabular-nums sm:text-sm';
          time.textContent = `記録 ${recordedDate}${timeFormat.format(timestamp)}`;
          row.append(time);
        }

        checkbox.addEventListener('change', () => {
          writeTime(date, period.key, checkbox.checked);
          renderCalendar();
          renderEntries(period.key);
        });
        entries.append(row);
        if (focusPeriod === period.key) checkbox.focus({ preventScroll: true });
      }

      byId('count').textContent = `服薬済み ${completed}／${periods.length}件`;
    }

    function moveMonth(offset) {
      month = new Date(month.getFullYear(), month.getMonth() + offset, 1);
      selected = month;
      renderCalendar();
      renderEntries();
    }

    byId('previous').addEventListener('click', () => moveMonth(-1));
    byId('next').addEventListener('click', () => moveMonth(1));
    byId('today').addEventListener('click', () => {
      selected = new Date();
      month = monthStart(selected);
      renderCalendar();
      renderEntries();
    });

    window.addEventListener('storage', event => {
      if (event.key === null || event.key.startsWith(prefix)) {
        renderCalendar();
        renderEntries();
      }
    });

    renderCalendar();
    renderEntries();
  </script>
</body>
</html>
